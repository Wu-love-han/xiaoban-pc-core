<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0f1115">
<title>小伴控制台</title>
<style>
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  body { margin:0; background:#0f1115; color:#c8cdd8; font:14px/1.6 -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif; }
  .wrap { max-width: 780px; margin: 0 auto; padding: 16px 14px 90px; }
  h1 { font-size:17px; color:#e6e9ef; margin:0 0 4px; font-weight:600; }
  .sub { color:#6b7280; font-size:12px; margin-bottom:16px; }
  .card { background:#161a21; border:1px solid #232936; border-radius:12px; padding:14px; margin-bottom:12px; }
  .card-h { display:flex; align-items:center; justify-content:space-between; margin-bottom:10px; }
  .card-t { font-weight:600; color:#e6e9ef; font-size:14px; }
  .dot { display:inline-block; width:8px; height:8px; border-radius:50%; margin-right:6px; }
  .on { background:#4ec9b0; } .off { background:#4a5160; } .warn { background:#e0a355; }
  .kv { display:flex; gap:8px; padding:5px 0; font-size:13px; }
  .kv .k { color:#6b7280; min-width:64px; flex-shrink:0; }
  .kv .v { color:#c8cdd8; word-break:break-word; }
  .tabs { display:flex; gap:6px; margin-bottom:14px; overflow-x:auto; padding-bottom:4px; }
  .tab { padding:8px 14px; border-radius:8px; background:#161a21; border:1px solid #232936; color:#8a93a5; font-size:13px; white-space:nowrap; cursor:pointer; }
  .tab.on { background:#4ec9b0; color:#0f1115; border-color:#4ec9b0; font-weight:600; }
  .btn { padding:9px 14px; border-radius:8px; border:1px solid #2a2e38; background:#1b2029; color:#c8cdd8; font-size:13px; cursor:pointer; }
  .btn.p { background:#4ec9b0; color:#0f1115; border-color:#4ec9b0; font-weight:600; }
  .btn.d { background:transparent; color:#e05555; border-color:#5a2a2a; }
  .btn:disabled { opacity:.5; }
  input, textarea { width:100%; background:#0f1115; border:1px solid #2a2e38; color:#e6e9ef; border-radius:8px; padding:10px; font:inherit; }
  textarea { resize:vertical; min-height:120px; line-height:1.55; }
  .row { display:flex; gap:8px; align-items:center; }
  .item { border:1px solid #232936; border-radius:8px; padding:10px; margin-bottom:8px; font-size:13px; }
  .item .t { color:#e6e9ef; font-weight:600; }
  .item .m { color:#6b7280; font-size:12px; margin-top:2px; }
  .msg { padding:9px 12px; border-radius:10px; margin-bottom:8px; max-width:88%; word-break:break-word; white-space:pre-wrap; }
  .msg.me { background:#1e2a28; margin-left:auto; color:#c8e8e0; }
  .msg.ai { background:#1a1f28; color:#c8cdd8; }
  .msg.sys { background:transparent; color:#6b7280; font-size:12px; max-width:100%; }
  .login { max-width:340px; margin:18vh auto; text-align:center; }
  .login h1 { font-size:22px; margin-bottom:8px; }
  .pin { font-size:24px; letter-spacing:10px; text-align:center; }
  .hidden { display:none !important; }
  .foot { position:fixed; bottom:0; left:0; right:0; background:#0f1115; border-top:1px solid #232936; padding:10px 14px calc(10px + env(safe-area-inset-bottom)); }
  .foot-inner { max-width:780px; margin:0 auto; display:flex; gap:8px; }
  .tag { display:inline-block; font-size:11px; padding:1px 7px; border-radius:5px; background:#232936; color:#8a93a5; margin-left:6px; }
  .tag.hi { background:#3a2a1a; color:#e0a355; }
</style>
</head>
<body>

<div id="loginView" class="login">
  <h1>小伴控制台</h1>
  <div class="sub" style="margin-bottom:18px">输入 PIN 才能进</div>
  <input id="pin" class="pin" type="tel" inputmode="numeric" maxlength="8" placeholder="······" autocomplete="off">
  <div style="height:12px"></div>
  <button class="btn p" id="btnLogin" style="width:100%">进入</button>
  <div class="sub" id="loginMsg" style="margin-top:12px;color:#e05555"></div>
</div>

<div id="appView" class="hidden">
  <div class="wrap">
    <div class="card-h">
      <div><h1>小伴控制台</h1><div class="sub" id="clock">—</div></div>
      <button class="btn" id="btnLogout">退出</button>
    </div>

    <div class="tabs">
      <div class="tab on" data-t="overview">概览</div>
      <div class="tab" data-t="tasks">任务</div>
      <div class="tab" data-t="memory">记忆</div>
      <div class="tab" data-t="persona">人格</div>
      <div class="tab" data-t="inbox">消息</div>
      <div class="tab" data-t="chat">对话</div>
      <div class="tab" data-t="docs">文档</div>
      <div class="tab" data-t="config">设置</div>
    </div>

    <div id="tab-overview"></div>
    <div id="tab-tasks" class="hidden"></div>
    <div id="tab-memory" class="hidden"></div>
    <div id="tab-persona" class="hidden"></div>
    <div id="tab-inbox" class="hidden"></div>
    <div id="tab-chat" class="hidden"></div>
    <div id="tab-docs" class="hidden"></div>
    <div id="tab-config" class="hidden"></div>
  </div>

  <div class="foot hidden" id="chatFoot">
    <div class="foot-inner">
      <input id="chatInput" placeholder="跟小伴说点什么…" autocomplete="off">
      <button class="btn p" id="btnChatSend">发送</button>
    </div>
  </div>
</div>

<script>
var $ = function (id) { return document.getElementById(id); };
var CUR = 'overview';
var POLL = null;

function esc(v) {
  return String(v == null ? '' : v).replace(/&/g,'&amp;').replace(/</g,'&lt;')
    .replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}
function api(method, path, body) {
  var opt = { method: method, headers: {} };
  if (body !== undefined) {
    opt.headers['Content-Type'] = 'application/json';
    opt.body = JSON.stringify(body);
  }
  return fetch(path, opt).then(function (r) {
    return r.text().then(function (t) {
      var d = null; try { d = t ? JSON.parse(t) : null; } catch (e) {}
      if (!r.ok) {
        if (r.status === 401) { showLogin(); }
        throw new Error((d && (d.error || d.detail)) || ('HTTP ' + r.status));
      }
      return d;
    });
  });
}
function showLogin() {
  $('appView').classList.add('hidden');
  $('loginView').classList.remove('hidden');
  if (POLL) { clearInterval(POLL); POLL = null; }
}
function showApp() {
  $('loginView').classList.add('hidden');
  $('appView').classList.remove('hidden');
  switchTab('overview');
  if (POLL) clearInterval(POLL);
  POLL = setInterval(function () { if (CUR === 'overview') loadOverview(); }, 8000);
}

// ---------------- 登录
$('btnLogin').onclick = function () {
  var pin = ($('pin').value || '').trim();
  if (!pin) return;
  $('btnLogin').disabled = true;
  api('POST', '/api/login', { pin: pin }).then(function (res) {
    if (res && res.ok) { $('loginMsg').textContent = ''; showApp(); }
    else { $('loginMsg').textContent = (res && res.error) || 'PIN 不对'; }
  }).catch(function (e) { $('loginMsg').textContent = e.message; })
    .then(function () { $('btnLogin').disabled = false; });
};
$('pin').addEventListener('keydown', function (e) { if (e.key === 'Enter') $('btnLogin').click(); });
$('btnLogout').onclick = function () {
  api('POST', '/api/logout').then(showLogin).catch(showLogin);
};

// ---------------- Tab
document.querySelectorAll('.tab').forEach(function (t) {
  t.onclick = function () { switchTab(t.getAttribute('data-t')); };
});
function switchTab(name) {
  CUR = name;
  document.querySelectorAll('.tab').forEach(function (t) {
    t.classList.toggle('on', t.getAttribute('data-t') === name);
  });
  ['overview','tasks','memory','persona','inbox','chat','docs','config'].forEach(function (n) {
    $('tab-' + n).classList.toggle('hidden', n !== name);
  });
  $('chatFoot').classList.toggle('hidden', name !== 'chat' && name !== 'inbox');
  var ci = $('chatInput');
  if (ci) ci.placeholder = name === 'inbox' ? '给它们下指令 / 回话…' : '跟小伴说点什么…';
  if (name === 'overview') loadOverview();
  if (name === 'tasks') loadTasks();
  if (name === 'memory') loadMemory();
  if (name === 'persona') loadPersona();
  if (name === 'chat') loadChat();
  if (name === 'inbox') loadInbox();
  if (name === 'docs') loadDocs();
  if (name === 'config') loadConfig();
}

// ---------------- 概览
function loadOverview() {
  api('GET', '/api/state').then(function (d) {
    if (!d || !d.ok) return;
    $('clock').textContent = d.at || '';
    var h = [];

    // 待确认（最上面）
    var cs = d.consent || [];
    if (cs.length) {
      h.push('<div class="card" style="border-color:#3a3222;background:rgba(224,163,85,.08)">');
      h.push('<div class="card-t" style="color:#e0a355">⏳ 等你确认（' + cs.length + '）</div>');
      cs.forEach(function (c) {
        h.push('<div class="item" style="margin-top:8px">');
        h.push('<div class="t">' + esc(c.target) + '</div>');
        h.push('<div class="m" style="white-space:pre-wrap">' + esc((c.detail || '').slice(0, 300)) + '</div>');
        h.push('<div class="row" style="margin-top:8px">');
        h.push('<button class="btn p" data-cid="' + esc(c.id) + '" data-act="approve">同意</button>');
        h.push('<button class="btn d" data-cid="' + esc(c.id) + '" data-act="deny">拒绝</button>');
        h.push('</div></div>');
      });
      h.push('</div>');
    }

    // 三端
    var pc = d.pc || {}, ph = d.phone || {}, rb = d.robot || {};
    h.push('<div class="card">');
    h.push('<div class="card-t">三端状态</div>');
    h.push('<div class="kv"><span class="k">电脑</span><span class="v"><span class="dot on"></span>' +
           esc(pc.foreground || '（拿不到）') + '</span></div>');
    h.push('<div class="kv"><span class="k">手机</span><span class="v"><span class="dot ' +
           (ph.online ? 'on' : 'off') + '"></span>' +
           (ph.online ? ('在线' + (ph.foreground ? ' · ' + esc(ph.foreground) : '') +
             (ph.shell === 'shizuku' ? '<span class="tag">shell权限</span>' : '')) : '离线') +
           '</span></div>');
    h.push('<div class="kv"><span class="k">机器人</span><span class="v"><span class="dot ' +
           (rb.online ? 'on' : 'off') + '"></span>' + esc(rb.name || '未接入') + '</span></div>');
    h.push('</div>');

    // 最近会话
    var ss = d.sessions || [];
    h.push('<div class="card"><div class="card-t">最近会话</div>');
    if (!ss.length) h.push('<div class="m">还没有</div>');
    ss.slice(0, 6).forEach(function (s) {
      h.push('<div class="kv"><span class="v">' + esc(s.title || '(无标题)') + '</span></div>');
    });
    h.push('</div>');

    $('tab-overview').innerHTML = h.join('');

    $('tab-overview').querySelectorAll('button[data-cid]').forEach(function (b) {
      b.onclick = function () {
        b.disabled = true;
        var act = b.getAttribute('data-act');
        var cid = b.getAttribute('data-cid');
        api('POST', '/api/consent/' + act, { id: cid })
          .then(loadOverview).catch(function (e) { alert(e.message); b.disabled = false; });
      };
    });
  }).catch(function () { /* 忽略 */ });
}

// ---------------- 任务
function loadTasks() {
  api('GET', '/api/state').then(function (d) {
    var ss = (d && d.sessions) || [];
    var h = ['<div class="card"><div class="card-t">会话（可以中断正在跑的）</div>'];
    if (!ss.length) h.push('<div class="m">还没有</div>');
    ss.forEach(function (s) {
      h.push('<div class="item"><div class="t">' + esc(s.title || '(无标题)') + '</div>');
      h.push('<div class="m">' + esc(s.id) + '</div>');
      h.push('<div class="row" style="margin-top:8px"><button class="btn d" data-sid="' +
             esc(s.id) + '">中断这个</button></div></div>');
    });
    h.push('</div>');
    $('tab-tasks').innerHTML = h.join('');
    $('tab-tasks').querySelectorAll('button[data-sid]').forEach(function (b) {
      b.onclick = function () {
        if (!confirm('确定中断这个会话？')) return;
        b.disabled = true;
        api('POST', '/api/task/cancel', { session_id: b.getAttribute('data-sid') })
          .then(function () { loadTasks(); }).catch(function (e) { alert(e.message); b.disabled = false; });
      };
    });
  }).catch(function () { /* 忽略 */ });
}

// ---------------- 记忆
function loadMemory(q) {
  var url = '/api/memory?limit=40' + (q ? ('&q=' + encodeURIComponent(q)) : '');
  api('GET', url).then(function (d) {
    var items = (d && d.items) || [];
    var h = ['<div class="card"><div class="card-t">记忆（' + items.length + '）</div>'];
    h.push('<div class="row" style="margin-bottom:10px"><input id="memQ" placeholder="搜一下…" value="' + esc(q || '') + '">');
    h.push('<button class="btn" id="memSearch">搜</button></div>');
    items.forEach(function (m) {
      h.push('<div class="item"><div class="t">' + esc(m.content) + '</div>');
      h.push('<div class="m">#' + m.id + ' · ' + esc(m.category) + ' · 重要度 ' +
             (m.importance || 0).toFixed ? (m.importance || 0).toFixed(2) : m.importance + '</div>');
      h.push('<div class="row" style="margin-top:8px">');
      h.push('<button class="btn" data-mid="' + m.id + '" data-act="edit">改</button>');
      h.push('<button class="btn d" data-mid="' + m.id + '" data-act="del">删</button>');
      h.push('</div></div>');
    });
    h.push('</div>');
    $('tab-memory').innerHTML = h.join('');

    $('memSearch').onclick = function () { loadMemory(($('memQ').value || '').trim()); };
    $('memQ').addEventListener('keydown', function (e) { if (e.key === 'Enter') $('memSearch').click(); });

    $('tab-memory').querySelectorAll('button[data-mid]').forEach(function (b) {
      b.onclick = function () {
        var id = parseInt(b.getAttribute('data-mid'), 10);
        var act = b.getAttribute('data-act');
        if (act === 'del') {
          if (!confirm('确定删掉这条记忆？')) return;
          api('POST', '/api/memory/forget', { id: id }).then(function () { loadMemory(); });
        } else {
          var cur = '';
          items.forEach(function (m) { if (m.id === id) cur = m.content; });
          var v = prompt('改成什么？', cur);
          if (v === null || !v.trim()) return;
          api('POST', '/api/memory/update', { id: id, content: v.trim() })
            .then(function () { loadMemory(); });
        }
      };
    });
  }).catch(function () { /* 忽略 */ });
}

// ---------------- 人格
function loadPersona() {
  api('GET', '/api/persona').then(function (d) {
    var h = ['<div class="card"><div class="card-t">人格设定（docs/PERSONA.md）</div>'];
    h.push('<div class="m" style="margin-bottom:8px">改完下一轮就生效，会自动备份旧版。</div>');
    h.push('<textarea id="personaText" style="min-height:380px;font-size:12px;font-family:ui-monospace,monospace">' +
           esc((d && d.text) || '') + '</textarea>');
    h.push('<div class="row" style="margin-top:10px"><button class="btn p" id="personaSave">保存</button>');
    h.push('<span class="m" id="personaMsg"></span></div></div>');
    $('tab-persona').innerHTML = h.join('');
    $('personaSave').onclick = function () {
      $('personaSave').disabled = true;
      api('POST', '/api/persona', { text: $('personaText').value })
        .then(function (r) {
          $('personaMsg').textContent = r && r.ok ? ('已保存，备份 ' + (r.backup || '')) : '保存失败';
        }).catch(function (e) { $('personaMsg').textContent = e.message; })
        .then(function () { $('personaSave').disabled = false; });
    };
  }).catch(function () { /* 忽略 */ });
}

// ---------------- 消息中心
function loadInbox() {
  api('GET', '/api/inbox?limit=40').then(function (d) {
    var items = (d && d.items) || [];
    var h = ['<div class="card"><div class="card-t">各端消息（' + items.length + '）</div>'];
    h.push('<div class="m" style="margin-bottom:10px">手机 AI、机器人 AI 有事会往这里报；你在这里回的话会广播给三端。</div>');
    if (!items.length) h.push('<div class="m">还没有消息</div>');
    items.forEach(function (m) {
      var border = m.priority >= 3 ? 'border-color:#5a2a2a;background:rgba(224,85,85,.06)'
        : (m.kind === 'alert' ? 'border-color:#3a3222;background:rgba(224,163,85,.06)' : '');
      h.push('<div class="item" style="' + border + '">');
      h.push('<div class="t">' + esc(m.text.slice(0, 200)) + '</div>');
      h.push('<div class="m">来源 ' + esc(m.source || '?') + ' · ' + esc(m.kind || '') +
             (m.acked ? ' · 已读' : '') + '</div>');
      if (m.type === 'consent') {
        h.push('<div class="row" style="margin-top:8px">');
        h.push('<button class="btn p" data-cid="' + esc(m.consent_id) + '" data-act="approve">同意</button>');
        h.push('<button class="btn d" data-cid="' + esc(m.consent_id) + '" data-act="deny">拒绝</button>');
        h.push('</div>');
      }
      h.push('</div>');
    });
    h.push('</div>');
    $('tab-inbox').innerHTML = h.join('');
    $('tab-inbox').querySelectorAll('button[data-cid]').forEach(function (b) {
      b.onclick = function () {
        b.disabled = true;
        api('POST', '/api/consent/' + b.getAttribute('data-act'), { id: b.getAttribute('data-cid') })
          .then(loadInbox).catch(function (e) { alert(e.message); b.disabled = false; });
      };
    });
  }).catch(function () { /* 忽略 */ });
}

// ---------------- 文档
function loadDocs() {
  api('GET', '/api/docs').then(function (d) {
    var items = (d && d.items) || [];
    var h = ['<div class="card"><div class="card-t">文档（' + items.length + '）</div>'];
    h.push('<div class="m" style="margin-bottom:10px">可以往这里传文件，也能下载。存到 ' + esc((d && d.dir) || '') + '</div>');
    h.push('<div class="row" style="margin-bottom:12px">');
    h.push('<input type="file" id="docFile" style="padding:8px">');
    h.push('<button class="btn p" id="docUpload">上传</button>');
    h.push('</div>');
    if (!items.length) h.push('<div class="m">还没有文件</div>');
    items.forEach(function (f) {
      h.push('<div class="item"><div class="t">' + esc(f.name) + '</div>');
      h.push('<div class="m">' + (f.size / 1024).toFixed(1) + ' KB</div>');
      h.push('<div class="row" style="margin-top:8px">');
      h.push('<a class="btn" href="/api/docs/download?name=' + encodeURIComponent(f.name) + '">下载</a>');
      h.push('</div></div>');
    });
    h.push('</div>');
    $('tab-docs').innerHTML = h.join('');
    $('docUpload').onclick = function () {
      var f = $('docFile').files[0];
      if (!f) { alert('先选个文件'); return; }
      var fd = new FormData();
      fd.append('file', f);
      $('docUpload').disabled = true;
      fetch('/api/docs/upload', { method: 'POST', body: fd })
        .then(function (r) { return r.json(); })
        .then(function (res) {
          if (!res.ok) alert('上传失败：' + (res.error || ''));
          loadDocs();
        })
        .catch(function (e) { alert(e.message); $('docUpload').disabled = false; });
    };
  }).catch(function () { /* 忽略 */ });
}

// ---------------- 对话
function loadChat() {
  api('GET', '/api/chat').then(function (d) {
    var items = (d && d.items) || [];
    var h = ['<div class="card" style="min-height:60vh"><div class="card-t">跟小伴说话（PC 端）</div>'];
    h.push('<div class="m" style="margin-bottom:10px">你有事可以直接问它。危险指令要确认时，它也会在这里问你。</div>');
    h.push('<div id="chatLog" style="max-height:58vh;overflow-y:auto">');
    items.forEach(function (m) {
      var cls = m.role === 'user' ? 'me' : 'ai';
      h.push('<div class="msg ' + cls + '">' + esc(m.content || '') + '</div>');
    });
    h.push('</div></div>');
    $('tab-chat').innerHTML = h.join('');
    var log = $('chatLog');
    if (log) log.scrollTop = log.scrollHeight;
  }).catch(function () { /* 忽略 */ });
}

$('btnChatSend').onclick = function () {
  var v = ($('chatInput').value || '').trim();
  if (!v) return;
  $('chatInput').value = '';
  if (CUR === 'inbox') {
    api('POST', '/api/inbox/send', { text: v, to: 'all' }).then(function () {
      loadInbox();
    }).catch(function (e) { alert(e.message); });
    return;
  }
  $('btnChatSend').disabled = true;
  var log = $('chatLog');
  if (log) {
    var me = document.createElement('div');
    me.className = 'msg me';
    me.textContent = v;
    log.appendChild(me);
    log.scrollTop = log.scrollHeight;
  }
  api('POST', '/api/chat', { text: v }).then(function (r) {
    if (log && r && r.reply) {
      var ai = document.createElement('div');
      ai.className = 'msg ai';
      ai.textContent = r.reply;
      log.appendChild(ai);
      log.scrollTop = log.scrollHeight;
    }
  }).catch(function (e) {
    if (log) {
      var er = document.createElement('div');
      er.className = 'msg sys';
      er.textContent = '出错：' + e.message;
      log.appendChild(er);
    }
  }).then(function () { $('btnChatSend').disabled = false; });
};
$('chatInput').addEventListener('keydown', function (e) {
  if (e.key === 'Enter') $('btnChatSend').click();
});

// 启动：先试一下有没有登录态
api('GET', '/api/state').then(function () { showApp(); }).catch(function () { showLogin(); });

// ---------------------------------------------------------------- 设置
async function loadConfig() {
  const el = document.getElementById('tab-config');
  el.innerHTML = '<div class="muted">读取中…</div>';
  const r = await api('GET', '/api/config');
  if (!r.ok) { el.innerHTML = '<div class="muted">读不到配置：' + (r.error || '') + '</div>'; return; }
  const items = r.items || [];
  const editable = items.filter(x => x.editable);
  const secret = items.filter(x => !x.editable);

  el.innerHTML =
    '<div class="muted" style="margin-bottom:10px">改完点「保存」。标灰的是安全项，不给改。</div>' +
    '<div style="display:grid;gap:8px">' +
    editable.map(function (x) {
      var v = x.value;
      var isBool = typeof v === 'boolean';
      var input = isBool
        ? '<select data-path="' + x.path + '" style="width:100%;padding:8px;background:#0f1115;border:1px solid #232936;border-radius:6px;color:#e6e8ee">' +
          '<option value="true"' + (v ? ' selected' : '') + '>开</option>' +
          '<option value="false"' + (!v ? ' selected' : '') + '>关</option></select>'
        : '<input data-path="' + x.path + '" value="' + String(v == null ? '' : v).replace(/"/g, '&quot;') + '" ' +
          'style="width:100%;padding:8px;background:#0f1115;border:1px solid #232936;border-radius:6px;color:#e6e8ee;font-family:inherit">';
      return '<div style="display:grid;grid-template-columns:220px 1fr 70px;gap:10px;align-items:center">' +
        '<div style="font-size:12px;color:#8a93a5">' + x.path + '</div>' +
        input +
        '<button class="btn ghost" data-save="' + x.path + '" style="font-size:12px">保存</button>' +
        '</div>';
    }).join('') +
    '</div>' +
    '<div style="margin-top:18px;padding-top:14px;border-top:1px solid #232936">' +
    '<div class="muted" style="margin-bottom:8px">安全项（只读）</div>' +
    secret.map(function (x) {
      return '<div style="display:grid;grid-template-columns:220px 1fr;gap:10px;font-size:12px;color:#6b7280;margin-bottom:6px">' +
        '<div>' + x.path + '</div><div>' + String(x.value) + '</div></div>';
    }).join('') +
    '</div>';

  // ---- 系统区块 ----
  var sys = document.createElement('div');
  sys.style.marginTop = '22px';
  sys.innerHTML =
    '<div style="padding-top:14px;border-top:1px solid #232936">' +
    '<div style="font-size:13px;font-weight:600;margin-bottom:10px">系统</div>' +
    '<div id="sys-info" class="muted" style="font-size:12px;margin-bottom:10px">读取中…</div>' +
    '<div style="display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px">' +
    '  <button class="btn ghost" id="btn-restart" style="font-size:12px">重启后端</button>' +
    '  <button class="btn ghost" id="btn-logs" style="font-size:12px">看日志</button>' +
    '  <button class="btn ghost" id="btn-tools" style="font-size:12px">看工具</button>' +
    '</div>' +
    '<div id="sys-out" style="font-size:11px;font-family:ui-monospace,monospace;background:#0f1115;border:1px solid #232936;border-radius:8px;padding:10px;max-height:340px;overflow:auto;white-space:pre-wrap;display:none"></div>' +
    '</div>';
  el.appendChild(sys);

  api('GET', '/api/system/info').then(function (i) {
    var t = document.getElementById('sys-info');
    if (!t) return;
    if (!i || !i.ok) { t.textContent = '读不到系统信息'; return; }
    t.textContent = '工具 ' + i.tools + ' 个 · 会话 ' + i.sessions +
      ' 个 · Python ' + i.python +
      (i.disk ? ' · 磁盘剩余 ' + i.disk.free_gb + 'GB' : '');
  });

  var out = document.getElementById('sys-out');
  function show(text) { out.style.display = 'block'; out.textContent = text; }

  var br = document.getElementById('btn-restart');
  if (br) br.onclick = async function () {
    if (!confirm('确定重启后端？大约 10 秒恢复。')) return;
    br.textContent = '重启中…';
    await api('POST', '/api/system/restart', {});
    show('后端正在重启，10 秒后刷新页面。');
    setTimeout(function () { location.reload(); }, 12000);
  };
  var bl = document.getElementById('btn-logs');
  if (bl) bl.onclick = async function () {
    var r2 = await api('GET', '/api/system/logs?lines=120');
    if (!r2.ok) { show('读日志失败：' + (r2.error || '')); return; }
    show((r2.lines || []).join('\n') || '(空)');
  };
  var bt = document.getElementById('btn-tools');
  if (bt) bt.onclick = async function () {
    var r3 = await api('GET', '/api/tools');
    if (!r3.ok) { show('读工具失败：' + (r3.error || '')); return; }
    show('共 ' + r3.count + ' 个工具：\n\n' +
      (r3.items || []).map(function (x) { return x.name + '  —  ' + x.desc; }).join('\n'));
  };

  el.querySelectorAll('[data-save]').forEach(function (btn) {
    btn.addEventListener('click', async function () {
      var path = btn.getAttribute('data-save');
      var input = el.querySelector('[data-path="' + path + '"]');
      var raw = input.value;
      btn.textContent = '…';
      var r2 = await api('POST', '/api/config', { path: path, value: raw });
      btn.textContent = r2.ok ? '✓' : '✗';
      if (!r2.ok) alert(r2.error || '保存失败');
      setTimeout(function () { btn.textContent = '保存'; }, 1200);
    });
  });
}

</script>
</body>
</html>
